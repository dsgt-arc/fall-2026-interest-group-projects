[project]
name = "homework-2"
version = "0.1.0"
description = "Teaching notebooks comparing text retrieval (Part 1) and image retrieval (Part 2) methods"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "diffusers>=0.35,<1",
    "ipykernel>=6.29,<7",
    "ipython>=8.30,<10",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "peft>=0.17,<0.19",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=5.1,<6",
    "torch>=2.6,<3",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["vision_ir/tests"]
