# NVIDIA CUDA dependency variant. Symlink this file to pyproject.toml before
# running `uv sync` on CUDA hosts; see README.md for the switching commands.
[project]
name = "fashion-fm"
version = "0.1.0"
description = "A tiny text-conditioned flow-matching model for FashionMNIST"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "click>=8.1",
  # Keep CUDA on the same PyTorch line used by the reference project's
  # CUDA 12.x configuration instead of resolving to CUDA 13 wheels.
  "cuda-python>=12.0,<13.0",
  "diffusers[torch]>=0.37.0",
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pillow>=11.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "torch>=2.10.0,<2.11",
  # Torchvision tracks the selected PyTorch release family.
  "torchvision>=0.25.0,<0.26",
  "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
fashion-fm = "fashion_fm.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
